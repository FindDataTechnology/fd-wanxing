# Same-origin routing (Q15): static face at /, the facade's public A2A plane
# and console-gated fleet reads behind /api/. Upstream names are the
# in-cluster Services from deploy/.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cross-site copilot loader (unify-cross-line-copilot 2.4): an exact path so
    # the SPA fallback above can never swallow it, with a short cache — a
    # binding change reaches host pages within minutes, not at the next deploy.
    # No build hash: v1 ships one loader version (D7).
    location = /copilot.js {
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
        try_files $uri =404;
    }

    location /api/wanxing/ {
        proxy_pass http://wanxing-facade:3080;
        proxy_set_header Host $host;
        proxy_read_timeout 600s; # A2A message/send runs whole turns
        proxy_buffering off;    # message/stream SSE passthrough
    }

    location /api/fleet/ {
        # Board/timeline ride the facade's console gate (identity verified at
        # the facade, observer service credential swapped in) — the observer
        # itself stays credential-only (add-console-session-continuity).
        proxy_pass http://wanxing-facade:3080;
        proxy_set_header Host $host;
    }
}
