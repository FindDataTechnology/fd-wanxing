# Same-origin routing (Q15): static face at /, the facade's public A2A plane
# and console-gated fleet reads behind /api/.
#
# 本文件是 envsubst 模板（容器启动时渲染成 conf.d/default.conf）：
# 白名单只替换 ${WANXING_FACADE_UPSTREAM}，nginx 运行时变量（$host/$uri…）原样保留。
# 为什么需要模板：静态写死 `wanxing-facade:3080` 会让 nginx 在**启动时**解析主机名，
# 任何没有集群 DNS 的环境（构建池 smoke、本地 docker run）都会 [emerg] host not found
# 而容器起不来。模板的默认值是 IP 字面量（无需解析），生产由 k8s env 指到真实 Service。
#
# ⚠️ 不要用「变量式 proxy_pass」(set $up + proxy_pass http://$up)：那会改变 URI
# 转发语义，2026-11-16 上线 5 分钟打挂全站 /api（502）后回滚。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A host page that typos an asset path must get 404, not index.html with a
    # 200: a <script>/<link> receiving HTML fails as a SyntaxError or a silent
    # no-op, which is exactly the "右下角什么都没有" mode the embed contract
    # forbids. Measured 2026-11-13: the README and the consumer table both name
    # the repo path `public/copilot.js`, and `/public/copilot.js` returned the
    # SPA's HTML (416 bytes, text/html) while the real script lives at
    # `/copilot.js` — a host following the docs would have been silently dead.
    # The two API prefixes below carry `^~` so this regex can never intercept a
    # proxied path (regex locations otherwise outrank plain prefixes).
    location ~* \.(?:js|mjs|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|json|txt)$ {
        try_files $uri =404;
        access_log off;
    }

    # Cross-site copilot loader (unify-cross-line-copilot 2.4): an exact path so
    # the SPA fallback above can never swallow it, with a short cache — a
    # binding change reaches host pages within minutes, not at the next deploy.
    # No build hash: v1 ships one loader version (D7).
    location = /copilot.js {
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /api/wanxing/ {
        proxy_pass http://${WANXING_FACADE_UPSTREAM};
        proxy_set_header Host $host;
        proxy_read_timeout 600s; # A2A message/send runs whole turns
        proxy_buffering off;    # message/stream SSE passthrough
    }

    location ^~ /api/fleet/ {
        # Board/timeline ride the facade's console gate (identity verified at
        # the facade, observer service credential swapped in) — the observer
        # itself stays credential-only (add-console-session-continuity).
        proxy_pass http://${WANXING_FACADE_UPSTREAM};
        proxy_set_header Host $host;
    }
}
