        - paragraph [ref=e62]: 萬星（Constellation）是寻数（FindData）五条产品线中的智能体服务线：把已经建好的 Agent 变成对外可调用的服务——部署、驻留、门面、计费与机群观测都由它承担。 它运行在寻数自有的机群上，与壹座（团队执行平台）、谦面（工作流搭建）、柏讯（数据智能）、 识律（法律智能）互通：任何一条线上的 agent 都可以经萬星对外服务。
