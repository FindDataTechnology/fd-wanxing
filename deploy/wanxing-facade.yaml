# wanxing facade — L1/L2 首上清单（add-facade-extraction 4.1）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wanxing-facade-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanxing-facade
spec:
  replicas: 1
  selector:
    matchLabels: { app: wanxing-facade }
  template:
    metadata:
      labels: { app: wanxing-facade }
    spec:
      containers:
        - name: facade
          image: ccr.ccs.tencentyun.com/yizuo/wanxing-facade:IMAGE_TAG
          ports: [{ containerPort: 3080 }]
          env:
            - name: WANXING_PORT
              value: "3080"
            - name: WANXING_DATA_ROOT
              value: /data
            # 计费面（借用契约）：sub2api
            - name: SUB2API_BASE_URL
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: sub2api_base_url }
            - name: SUB2API_ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: sub2api_admin_key }
            # 运行时真相与路由（借用契约）：謙面 registry + packs 内部 API
            - name: AGENT_SERVING_REGISTRY_URL
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: registry_url }
            - name: AGENT_SERVING_REGISTRY_TOKEN
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: registry_token }
            - name: AGENT_SERVING_BACKEND_TOKEN
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: backend_token }
            - name: PACKS_INTERNAL_BASE_URL
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: packs_internal_base_url }
            # 观测面上报（同平面内点对点）
            - name: FLEET_OBSERVER_URL
              value: http://fleet-observer:3200
            - name: FLEET_OBSERVER_TOKEN
              valueFrom:
                secretKeyRef: { name: wanxing-fleet, key: ingest_token }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 3080 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wanxing-facade-data }
---
apiVersion: v1
kind: Service
metadata:
  name: wanxing-facade
spec:
  selector: { app: wanxing-facade }
  ports: [{ port: 3080, targetPort: 3080 }]
---
