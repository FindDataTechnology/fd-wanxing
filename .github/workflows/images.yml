# Container images — GitHub Actions → Tencent TCR (org convention, mirrors
# paas image.yml). One workflow, three images:
#   ccr.ccs.tencentyun.com/yizuo/wanxing-facade   (repo root, SERVICE=facade)
#   ccr.ccs.tencentyun.com/yizuo/fleet-observer   (repo root, SERVICE=observer)
#   ccr.ccs.tencentyun.com/yizuo/wanxing-web      (wanxing-web/ context)
#
# Secrets (org-level — must be enabled for THIS repo before first run):
#   TCR_USERNAME / TCR_PASSWORD.
name: images

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: yizuo

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: facade
            image: wanxing-facade
            context: .
          - service: observer
            image: fleet-observer
            context: .
          - service: web
            image: wanxing-web
            context: wanxing-web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
