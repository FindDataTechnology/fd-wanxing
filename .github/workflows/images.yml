# Container images — GitHub Actions → Tencent TCR, canonical pipeline
# (paas repo docs/IMAGE-RELEASE.md): push hkccr (HK, fast leg), cheap-3 tcr-relay
# replicates to ccr (≤5min). Cluster references use the ccr prefix after the
# relay lands the tag.
#
#   hkccr.ccs.tencentyun.com/yizuo/{wanxing-facade,fleet-observer,wanxing-web}
#   → ccr.ccs.tencentyun.com/yizuo/… (relay)
#
# Secrets (per-repo — org-level secrets do NOT apply to private repos):
#   TCR_USERNAME / TCR_PASSWORD  (hk push credential)
# cheap-3 /etc/tcr-relay/repos.conf must list each <namespace>/<repo>.
name: images

# 2026-11-09 按 image-quota-allocation R2 停用私有仓自动出片：出片由
# scs001/fd-wanxing-images 承担（该仓已转公开，走免费线；已用 git tree 核对内容一致）。
# 本仓 CI 因组织私有额度耗尽而全部瞬时失败，无产出。保留手动入口以便回滚。
on:
  workflow_dispatch:

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: yizuo

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Release gate (wanxing-release-gate): tests run BEFORE any image push —
      # a red test means no new tags, existing images untouched.
      - name: Backend tests (facade / fleet-observer / stats-collector)
        run: npm test
      - name: Frontend tests (wanxing-web)
        run: npm --prefix wanxing-web test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: facade
            image: wanxing-facade
            context: .
          - service: observer
            image: fleet-observer
            context: .
          - service: web
            image: wanxing-web
            context: wanxing-web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 内容基线：读 main 当前 digest（未认证/不存在都容忍，空 = 首次构建）
      - id: prev
        name: 读 main 当前 digest（内容基线）
        run: |
          img="$REGISTRY/$NAMESPACE/${{ matrix.image }}"
          cur=$(docker buildx imagetools inspect "$img:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=$cur" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.image }} main 当前 digest: ${cur:-<不存在，本次为首次构建>}"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          # 硬约束：开了 attestation，同内容两次构建 digest 必然不同，闸门永久失效。
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # 内容闸门：digest 变了才铸 sha-<commit>，让「同内容多 tag」结构上不可能。
      - name: 内容变了才铸不可变 tag
        env:
          NEW: ${{ steps.build.outputs.digest }}
          OLD: ${{ steps.prev.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          img="$REGISTRY/$NAMESPACE/${{ matrix.image }}"
          [ -n "$NEW" ] || { echo "::error::构建未产出 digest"; exit 1; }
          if [ "$NEW" = "$OLD" ]; then
            echo "内容未变（${NEW}）：不铸新 tag"
            {
              echo "### 内容未变，未产出新 tag"
              echo ""
              echo "本次构建与 \`main\` 当前指向完全一致。"
              echo ""
              echo "- 可直接 pin：\`$img@$NEW\`"
              echo "- 滚动引用：\`$img:main\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$img:$tag" "$img@$NEW"
          echo "已铸 $tag → $NEW"
          {
            echo "### 内容有变化，已铸不可变 tag"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| tag | \`$tag\` |"
            echo "| digest | \`$NEW\` |"
            echo "| 上一内容 digest | \`${OLD:-<无>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
